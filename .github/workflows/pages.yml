# Strona z site/ na GitHub Pages z własną domeną: https://notgeese.cc/
# Domena ustawiona w Settings → Pages; DNS w Cloudflare (rekordy A/AAAA na GitHub Pages).
# Metadane gier czyta z games/*/game.yaml, paczki leżą w site/public/pobierz.
name: Strona

on:
  push:
    branches: [main]
    paths: ['site/**', 'supabase/functions/_shared/workspace/**', 'games/catalog.yaml', 'games/*/game.yaml', 'games/*/README.md', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      # Testy e2e chodzą po zbudowanej stronie (astro preview). Jeśli padną, job się
      # zatrzymuje tutaj: artefakt nie powstaje i deploy nie rusza.
      - run: npx playwright install --with-deps chromium
        working-directory: site
      - run: npx playwright test
        working-directory: site
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            site/playwright-report
            site/test-results
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
