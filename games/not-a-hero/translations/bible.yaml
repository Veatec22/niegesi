losowanie:
  zasada: >-
    Oficjalne FR/DE/IT/ES usunęły pule. Po polsku pule przymiotnikowe zamieniono na
    przysłówki, bo przysłówek się nie odmienia: „JEST $AWESOME$”, „$TERRIBLE$ ZŁY WRÓG”,
    „BĘDZIE $FUCKING$ $TERRIBLE$”. Pule rzeczowników i czasowników zastąpiono stałymi
    słowami. Zostają znaczniki związane z obrazem lub grą, w mianowniku.
  przyslowki: [FUCKING, ANFUCKING, AWESOME, ANAWESOME, TERRIBLE, ANTERRIBLE, MEDIOCRE, ANMEDIOCRE, DESCRIPTION, ANDESCRIPTION, ADJECTIVE, ANADJECTIVE]
  orzecznik_mi: DISSAPOINTED — „JEST MI $DISSAPOINTED$” (SMUTNO, PRZYKRO…)
  okolicznik: QUANTITIES — nieodmienne okoliczniki czasu
  wykrzyknik: FUCK — tylko jako samodzielny wykrzyknik; INSULTS tylko po „CO ZA”
  mianownik: [SUBJECTOBJECT, SCENEOBJECT, THESCENEOBJECT, NAME]
  uwaga: $SUBJECTOBJECTS$ (angielski dopisuje S) zastąpiony $SUBJECTOBJECT$ w cudzysłowie.

ustawienia:
  dialog_klucz: '^Src/(talk|ENDS)\.ini\|\d'
  max_wiersz: 170

ignoruj:
  - sprawdzenie: angielski
    klucz: '\|(111111111|12121213430)\|5$|^Src/ENDS\.ini\|10\|8$'
    powod: Kwestie z samych przysłówków z puli — tekst po polsku jest ten sam co po angielsku.
  - sprawdzenie: spojnosc
    klucz: '\|(AN)?(TERRIBLE|DESCRIPTION)\|'
    powod: Różne pule mają osobne słowniki; DREADFUL w TERRIBLE i DESCRIPTION celowo różnią się synonimem.
  - sprawdzenie: dlugosc
    klucz: '\|VERBE?D?\|'
    powod: Pule czasowników nie są używane w polskich zdaniach.
  - sprawdzenie: tokeny
    klucz: '^menu\|controller_detected$'
    powod: Nawiasy klamrowe oznaczają biały kolor słów w grafice (tools/menus.py), nie tekst.
  - sprawdzenie: terminy
    klucz: '^exe\|0x305d34$'
    powod: Etykieta klawisza w EXE ma 11 bajtów — WŚLIZG = BTN (12) się nie mieści, zostaje ŚLIZG.
  - sprawdzenie: spojnosc
    klucz: '^(menu\|(main|election|election_day)|exe\|0x303978|card\|\d+)$'
    powod: Ten sam angielski napis w miejscach o różnej szerokości albo o postaci innej płci (SZYBKI/SZYBKA).
