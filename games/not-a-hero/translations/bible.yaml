zrodla:
  - id: pliki
    opis: Src/talk.ini (odprawy), Src/ENDS.ini (omówienia), Src/chat.ini (kwestie w poziomach), Src/LEVELS/SETTINGS.ini oraz grafiki Assets.dat instalacji GOG.
  - id: obce
    opis: Oficjalne talk/ENDS -fre, -ger, -ita, -spa tej samej gry. Nie mają pul losowanych słów, zdania są stałe.
  - id: sklep
    url: https://www.gog.com/en/game/not_a_hero
    opis: BunnyLord jest kandydatem na burmistrza i zleca oczyszczenie miasta.
  - id: font
    opis: Atlas 5873 (font okna dialogowego) ma w komórce '*' fioletową głowę BunnyLorda — gra nią cenzuruje przekleństwa.

postacie:
  - id: bunnylord
    nazwa: BunnyLord
    plec: m
    klucz: '^Src/(talk|ENDS)\.ini\|'
    mowi_do_gracza: wy w odprawach (drużyna), ty w omówieniach (jeden agent, płeć nieznana)
    rejestr: absurdalny polityk z przyszłości, entuzjastyczny, wulgarny, bez hamulców
    odmiana: BunnyLord, BunnyLorda, BunnyLordowi (z wielkiej litery w tekście wersalikami bez znaczenia)
    zrodlo: [pliki, sklep]
  - id: agent
    nazwa: $NAME$ (Steve, Cletus, Samantha, Ronald, Clive, Mike, Jesus, Kimmy, Stanley)
    plec: '?'
    mowi_do_gracza: '-'
    rejestr: postać wybrana przez gracza; wśród agentów są kobiety (Samantha, Kimmy)
    uwaga: >-
      Formy do agenta i agenta o sobie bezosobowe lub neutralne: „poszło ci”, „dałoby się”,
      „umrę”, nigdy „zrobiłeś/zrobiłaś”. Dotyczy ENDS.ini, sekcji wstępu [111111111],
      [12121213430] i chat.ini. Wyjątek: telefony CELLPHONE do Steve'a (męskie).
    zrodlo: [pliki]
  - id: ruby
    nazwa: ciocia Ruby
    plec: k
    zrodlo: [pliki]
  - id: akemi
    nazwa: Akemi Unagi
    plec: k
    zrodlo: [pliki]
  - id: bogdan
    nazwa: Bogdan Nabatov
    plec: m
    zrodlo: [pliki]
  - id: upgraydd
    nazwa: Upgraydd
    plec: m
    zrodlo: [pliki]

