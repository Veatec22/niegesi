decyzje:
- Zachowano zaakceptowane 111 wpisów próbki.
- Narrator podniosły, bez sztucznych rymów; dziennik w pierwszej osobie żeńskiej Adrestii.
- C.I.R.C.E. pozostaje oznaczeniem systemu, Circe jako nazwa komory to Kirke.
- Polski ma kod pl i osobną pozycję selektora; angielski nie jest zastępowany (użytkownik).
- Granica 110 znaków raportu wynika z długości już zaakceptowanej próbki, nie gwarantuje
  tempa odczytu wszystkich napisów.
- 'Review 2026-09-25: komora to zawsze Kirke, także w komunikacie CirceAutoSecurity1.2;
  C.I.R.C.E. tylko w nazwie interfejsu.'
