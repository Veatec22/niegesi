ustawienia:
  dialog_klucz: '^TurboVoices (?:vo|combat)_'
  max_wiersz: 42

ignoruj:
  - sprawdzenie: adresat
    klucz: 'vo_e3m1_(14|19)_samm$'
    powod: S.A.M.M. mówi tu do SYN, nie do Johnny'ego.
  - sprawdzenie: terminy
    klucz: 'augment_chegg_(short)?desc$'
    powod: opis przedmiotu „Piłonoga” — „noga z piłą” celowo wyjaśnia nazwę.
  - sprawdzenie: terminy
    klucz: 'vo_e1m8_17_exec$|vo_e1m4_6_samm$|vo_e1m7_5_samm$|vo_e2m8_16_exec$'
    powod: termin zastąpiony zaimkiem albo „urządzeniem” — zgodnie z kontekstem kwestii.
  - sprawdzenie: terminy
    klucz: 'infodex_log_doc1_desc$'
    powod: „augment” jako czasownik („ulepszające ciało”).
  - sprawdzenie: angielski
    klucz: 'jukebox_|credits_'
    powod: tytuły utworów i nazwy firm zostają w oryginale.
  - sprawdzenie: typografia
    klucz: 'jukebox_'
    powod: cudzysłów zależy od oryginału; tytuł bez zmian.
  - sprawdzenie: spojnosc
    klucz: 'hitmarker|Hold the line|hold_the|secret_desc_orbit|vo_e3m3_36_combat|mtoggle_low|restart$|endtally|shop_(exit|leave|back)|workshopbrowser_rateleave|conf_editor4|character_syn|TurboStrings syn$|vo_e3m8_(5|16)_maw|combat_jazz_flinch0[456]|mtoggle_head|augmentcategoryalt_head|outskirts|texbrowser_c6|skilldesc3|menu_cs_[17]|cd_start|credit_char9|buzby1_title|codex_stimpack|menu_disp|menu_return'
    powod: różnice wynikają z kontekstu (dźwięk vs znacznik, rodzaj ustawienia, wersaliki, etykieta postaci) albo są identyczne poza wielkością liter.
  - sprawdzenie: spojnosc
    klucz: 'ammo_shells$|codex_shells$'
    powod: licznik amunicji ma krótkie „Naboje”, infodeks pełne „Naboje do strzelby”.
  - sprawdzenie: wielkie_litery
    klucz: 'jukebox_ripper$|editor_publishtosteam$|credit_char7$'
    powod: nazwy własne (tytuł utworu, Warsztat Steam, Radio Paradise).
  - sprawdzenie: spojnosc
    klucz: 'coop_prompt_(create|join)roomfailed$'
    powod: błąd w oryginale — wpis „join” ma tekst „Create Room Failed”; PL według klucza.
