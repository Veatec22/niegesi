# Biblia tłumaczenia Turbo Overkill — fakty ze źródłami. Format: .claude/skills/lokalizacja/BIBLIA.md

zrodla:
  - id: klucze
    opis: Pole `term` w TurboVoices, np. vo_e3m1_7_syn — mówiący w sufiksie klucza.
  - id: obsada
    opis: Obsada głosowa (SYN — Patricia Summersett; The Exec — DB Cooper, aktorka)
    url: https://english-voice-over.fandom.com/wiki/Turbo_Overkill_(2023)
  - id: dbcooper
    opis: Bio DB Cooper z zaimkami żeńskimi
    url: https://www.thegdex.com/speakers-2025/db-cooper
  - id: ru
    opis: Rosyjska tabela gry (work/ref-ru.json) — płeć w czasie przeszłym; poszlaka
  - id: tekst
    opis: Oryginalny tekst gry — zaimki i zwroty o postaci

postacie:
  - id: samm
    nazwa: S.A.M.M.
    plec: m
    klucz: '^TurboVoices vo_.*_samm$'
    mowi_do_gracza: pan („sir”)
    rejestr: uprzejmy, suchy brytyjski humor, rzadkie przekleństwa dla efektu
    zrodlo: [klucze, ru, tekst]
    uwaga: „Think of him as your mom, dad…” (nagranie mamy); ru „я знал”.
  - id: syn
    nazwa: SYN
    plec: k
    klucz: '^TurboVoices vo_.*_syn$'
    mowi_do_gracza: ty
    rejestr: patetyczny, boski, bez wulgaryzmów
    odmiana: nieodmienna („bez SYN”, „SYN pochłonęła”); „wirus SYN”, „program SYN, który…”
    zrodlo: [obsada, ru, tekst]
    uwaga: ru „я пришла”; „protect your mother”; S.A.M.M. mówi „her”, „madame”.
  - id: exec
    nazwa: Dyrektor
    plec: k
    klucz: '^TurboVoices vo_.*_exec$'
    mowi_do_gracza: ty („kid”)
    rejestr: korporacyjny cwaniak, dużo przekleństw
    zrodlo: [obsada, dbcooper, tekst]
    uwaga: Ripper nazywa ją „boss lady”. Etykieta „Dyrektor” zostaje (rzeczownik dla obu płci).
  - id: maw
    nazwa: Maw
    plec: m
    klucz: '^TurboVoices vo_.*_maw$'
    mowi_do_gracza: ty
    rejestr: brutalny, szyderczy, później obłąkany
    odmiana: Mawa, Mawem, Mawowi
    zrodlo: [klucze, ru, tekst]
  - id: ripper
    nazwa: Ripper
    plec: k
    klucz: '^TurboVoices vo_.*_ripper$'
    mowi_do_gracza: ty
    rejestr: psychopatyczna, zalotna, wulgarna
    odmiana: nieodmienna (żeńskie imię na spółgłoskę)
    zrodlo: [tekst]
    uwaga: „Ripper, bless her heart” (nagranie Dyrektora). ru „я убил” to błąd rosyjskiej wersji.
  - id: jazz
    nazwa: Jazz
    plec: m
    klucz: '^TurboVoices vo_.*_jazz$'
    mowi_do_gracza: ty
    zrodlo: [tekst]
    uwaga: „Gotta assume he’s been mulched” (S.A.M.M. o Jazzie).
  - id: doc
    nazwa: Doktor (dr Nyx)
    plec: m
    klucz: '^TurboVoices vo_.*_doc$'
    mowi_do_gracza: ty
    zrodlo: [tekst]
    uwaga: „He kept himself a little backup copy” (Dyrektor o Doktorze).
  - id: captain
    nazwa: Kapitan (Cynobrowy Front)
    plec: m
    klucz: '^TurboVoices vo_.*_captain$'
    mowi_do_gracza: ty („son”)
    zrodlo: [tekst]
    uwaga: Sierżant odpowiada kapitanowi „It is, sir”.
  - id: johnny
    nazwa: Johnny Turbo (niemy gracz)
    plec: m
    odmiana: Johnny'ego, Johnny'emu; „Turbo” nieodmienne
    zrodlo: [tekst]

