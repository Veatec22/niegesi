# Biblia tłumaczenia Void Bastards — fakty ze źródłami. Format: .claude/skills/lokalizacja/BIBLIA.md

zrodla:
  - id: klucze
    opis: Klucze I2 — Dialog/<scena>_<n>_<mówiący> (BACS, LiHua, Pirate, Player, HACS).
  - id: kontekst
    opis: Pole Description w I2 (227 wpisów) — notatki twórców dla tłumaczy, w review jako `context`.
  - id: obsada
    opis: B.A.C.S. mówi głosem Kevana Brightinga (narrator Stanley Parable)
    url: https://steamcommunity.com/app/857980/discussions/0/1743352529780893608/
  - id: tytuly
    opis: Terminy Title/MaleSingle, FemaleSingle, FemaleMarried — postać gracza bywa mężczyzną i kobietą.
  - id: ru
    opis: Rosyjska tabela gry (work/ref-ru.json) — poszlaka

postacie:
  - id: bacs
    nazwa: B.A.C.S.
    plec: m
    klucz: '^Dialog/.*_BACS$'
    mowi_do_gracza: ty
    rejestr: >
      korporacyjna nowomowa HR i BHP, uprzejmie-pasywno-agresywny; „action items”, „KPI”,
      „work-life balance”, „stakeholders”. Po polsku: żargon korpo („Twoje zadania do realizacji”,
      „wskaźniki KPI”), nigdy wulgarnie.
    zrodlo: [obsada, klucze]
    uwaga: Do gracza bez form rodzajowych — płeć klienta jest losowa (zob. gracz).
  - id: gracz
    nazwa: klient (postać gracza)
    plec: n
    klucz: '^Dialog/.*_Player$'
    rejestr: cyniczny więzień, krótkie riposty
    zrodlo: [tytuly, klucze]
    uwaga: >
      Płeć losowana dla każdej postaci. W kwestiach gracza i w zwrotach do gracza
      wyłącznie formy bezrodzajowe: czas teraźniejszy/przyszły, bezokolicznik, strona
      bezosobowa („Wygląda na to, że użyto…”), nigdy „zrobiłeś/zrobiłaś”, „gotowy/gotowa”.
  - id: lihua
    nazwa: Li Hua (kapitan piratów)
    plec: '?'
    klucz: '^Dialog/.*_LiHua$'
    rejestr: szkocki dialekt w oryginale → polski slang uliczny
    zrodlo: [klucze, kontekst]
    uwaga: Płeć nieustalona (ru nie rozstrzyga) — formy bezrodzajowe („mam to niby zrobić osobiście??”).
  - id: pirat
    nazwa: pirat (załoga)
    plec: m
    klucz: '^Dialog/.*_Pirate$'
    rejestr: szkocki dialekt → slang („ziomy”, „gnojek”, „kurde”); twórcy dali przekład w Description
    zrodlo: [kontekst]

