ustawienia:
  dialog_klucz: '^(Dialog|CS)/'
  max_wiersz: 42

ignoruj:
  - sprawdzenie: spojnosc
    klucz: '^(Difficulty/Normal|Options/NormalOption|Difficulty/ScreenTitle|Difficulty/SliderLabel|PauseMenu/DifficultyButtonLabel)$'
    powod: „Normalny” (poziom) i „Normalne” (ustawienie); przycisk menu z podpisem „Ustawienia” skrócony do „Trudność”.
  - sprawdzenie: angielski
    klucz: '^(Difficulty/Ironman|Options/AudioSurroundOption|PauseMenu/OptionsButtonSubLabel|PauseMenu/Start)$'
    powod: słowa używane tak samo po polsku (Ironman, surround, Menu, Start).
  - sprawdzenie: angielski
    klucz: '^(Key/|Language/|Profile/(HealthCount|MeritsCount|MeritsCountSingular)$)'
    powod: nazwy klawiszy używane po polsku bez zmian, nazwy języków w ich własnym języku, same tokeny.
  - sprawdzenie: liczebniki
    klucz: '^costsXMerits$'
    powod: "zapisane jako etykieta z dwukropkiem, więc odmiana nie zależy od liczby."
  - sprawdzenie: spojnosc
    klucz: '.'
    powod: przejrzane — różnice wynikają z kontekstu (skrót na mapie vs pełna nazwa pomieszczenia, klawisz vs akcja, tryb rozkazujący vs stan).
  - sprawdzenie: terminy
    klucz: '^(CS/CS_Care_Prog2_PAN1_Text1|Challenges/long haul description)$'
    powod: termin oddany zaimkiem albo krótszą formą („części do zadań”).
  - sprawdzenie: wielkie_litery
    klucz: '^(CS/CS_Prog5_PG2_PAN1_Text1|Offense/(DEADEYE|TRIGGER_HAPPY))$'
    powod: nazwy własne (Orbitalne Centrum…, Pac Force).
