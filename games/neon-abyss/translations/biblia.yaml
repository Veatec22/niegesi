# Biblia tłumaczenia Neon Abyss — fakty ze źródłami. Format: .claude/skills/lokalizacja/BIBLIA.md
# Stan: pełne tłumaczenie 0.2.0 (2639/2639).

zrodla:
  - id: klucze
    opis: "Klucze I2 w work/source.json, np. Dialogue1004_7_Secretary — mówiący na końcu klucza."
  - id: ru
    opis: "Rosyjska kolumna tej samej tabeli I2 (globalgamemanagers.assets, obiekt 3492) — płeć w czasie przeszłym."
  - id: tekst
    opis: "Angielski oryginał: zaimki he/she w opisach, kontekst kwestii."

postacie:
  - id: hades
    nazwa: Hades
    plec: m
    klucz: '_Hades$'
    mowi_do_gracza: ty
    rejestr: "szef baru, skąpy cwaniak, narzeka na budżet"
    zrodlo: [ru, tekst]
    uwaga: "RU „Недавно я ездил”, „я все понял”."
  - id: lans
    nazwa: Lans (inwestor)
    plec: m
    klucz: '_Lans$'
    mowi_do_gracza: '-'
    rejestr: "apodyktyczny inwestor, mówi do Hadesa per ty"
    zrodlo: [tekst]
    uwaga: "Hades: „The stupid investor... What does he expect”, Sekretarka: „What does he want this time?”. RU nie rozstrzyga."
  - id: sekretarka
    nazwa: Sekretarka
    plec: k
    klucz: '_Secretary(_0\d)?$'
    mowi_do_gracza: ty
    rejestr: "korporacyjna służbistka, straszy obcinaniem pensji"
    zrodlo: [ru, tekst]
    uwaga: "RU „Должна сказать”, Hades: „Talk to her”. Gracz to „Pracownik nr 233”; bez czasu przeszłego o graczu."
  - id: programista
    nazwa: Programista (Sir Żarłocelot)
    plec: m
    klucz: '_[Pp]rogrammer$'
    mowi_do_gracza: wy
    rejestr: "niezdarny samochwała"
    zrodlo: [ru, tekst]
    uwaga: "RU „чуть не забыл”, zwraca się „вы”, „Hello strangers”."
  - id: stylistka
    nazwa: Stylistka
    plec: k
    klucz: '_Stylist$'
    mowi_do_gracza: ty
    zrodlo: [ru, tekst]
    uwaga: "RU „я была графическим дизайнером”, Sekretarka: „she's good with computers”."
  - id: barmanka
    nazwa: Barmanka
    plec: k
    zrodlo: [tekst]
  - id: gracz
    nazwa: "gracz (Anna, Amir, James, Saya, Lucas, Matt, Ming, R-6, Wade, Zack)"
    plec: '?'
    uwaga: "Postacie obu płci — wszystko, co mówi się do gracza, jest bezrodzajowe (bez „zrobiłeś”, „gotowy”)."
  - id: zwierzaki
    nazwa: zwierzaki
    plec: '?'
    uwaga: "Oryginał daje he/she, a polska nazwa ma własny rodzaj (KAKTUSIK vs „she”) — opisy bez zaimków."

