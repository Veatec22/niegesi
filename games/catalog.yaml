# Katalog gier na stronie: status spolszczenia i data dodania każdej gry.
# Jedyne miejsce, w którym się je ustawia.
#
# Każda gra stoi pod swoim statusem jako `slug: data dodania` (RRRR-MM-DD).
# Zmiana statusu = przeniesienie tej linijki pod inny status; data jedzie razem z nią.
# Data wyznacza sortowanie „najnowsze” na stronie.
# Każda gra z games/<slug>/game.yaml musi stać pod dokładnie jednym statusem,
# inaczej build strony się zatrzyma i powie, której brakuje.
#
# Kolejność statusów w tym pliku to kolejność kafelków na stronie i opcji w filtrze.
# `label` trafia na plakietkę, `description` do podpowiedzi przy plakietce w panelu gry,
# `tone` to wygląd plakietki: ink (czarna), outline (sama ramka) albo accent (karminowa).

gotowe:
  label: gotowe
  description: Cała gra przetłumaczona i sprawdzona w grze od początku do końca.
  tone: ink
  games:
    shotgun-cop-man: 2026-09-19

testowe:
  label: wersja testowa
  description: Cały tekst przetłumaczony, ale w grze sprawdzony tylko częściowo, bez przejścia od początku do końca. Mogą się trafić usterki.
  tone: outline
  games:
    anger-foot: 2026-09-19
    boomerang-x: 2026-09-20
    dread-templar: 2026-09-19
    labyrinth-of-the-demon-king: 2026-09-21
    my-friend-pedro: 2026-09-21
    otxo: 2026-09-20
    skate-story: 2026-09-21
    sprawl: 2026-09-19
    turbo-overkill: 2026-09-21
    void-bastards: 2026-09-21
    wild-bastards: 2026-09-21

w-trakcie:
  label: w trakcie
  description: Tłumaczenie jeszcze powstaje. Paczka pojawi się, kiedy będzie komplet tekstu.
  tone: accent
  games: {}
