ustawienia:
  dialog_klucz: '^Dialog/'
  max_wiersz: 42

ignoruj:
  - sprawdzenie: spojnosc
    klucz: '^(HUD/Dead|UIMG/Injured|Options/(AccelerationOne|Normal|StandardResponse|AccelerationTwo|High|Q2))(Fem)?$'
    powod: "warianty rodzajowe gry (Fem) i zgoda z rzeczownikiem ustawienia (przyspieszenie, jakość, krzywa)."
  - sprawdzenie: terminy
    klucz: '^(Hint/(CasinoStunt|Gambler)|TalentDesc/(KABOOM_SNEAKY|LAIKA_CHARGE_SHIELDING))$'
    powod: "słowo „stunt” zastąpione nazwą popisu (Ruletka, Odpalenie, niewidzialność)."
  - sprawdzenie: terminy
    klucz: '^Dialog/(RosaInitArg_2|DogwoodSector_6|Frontier_2|AstronautJudgeArg_1)$'
    powod: "w dialogu „stunt” = numer, „shine” = lśnić, „pal” = kolego — nie terminy gry."
  - sprawdzenie: terminy
    klucz: '^(TalentRank/\d|TraitName/GoodItems|Location/ItemShop|InteractionDescription/Barricade|Hint/ScatterFind)$'
    powod: ranga asa bez słowa „mod”; świadome synonimy (łupy, handlarz, zapora, ci, którzy znajdą).
