# Biblia tłumaczenia Wild Bastards — fakty ze źródłami. Format: .claude/skills/localization/BIBLE.md
# Stan: pełne tłumaczenie 0.2.0 (4426/4426).

zrodla:
  - id: klucze
    opis: "Klucze I2 z wariantami rodzajowymi (np. HUD/Dead i HUD/DeadFem, UIMG/Injured i UIMG/InjuredFem)."
  - id: tekst
    opis: "Oryginalny tekst gry (samouczki i dialogi mówią o banitach „he”/„her”, „Miss”, „ma'am”)."
  - id: fr
    opis: "Francuska tabela gry (work/ref-fr.json) — płeć w przymiotnikach i imiesłowach (archère, sûre, ange-gardienne)."
  - id: it
    opis: "Włoska tabela gry (work/ref-it.json) — płeć w rzeczownikach (sacerdotessa, pistolera, arciera)."
  - id: ru
    opis: "Rosyjska tabela gry jest pusta (2 wpisy) — nie nadaje się na źródło płci."
  - id: vb
    opis: "Nasze Void Bastards PL (games/void-bastards) — ten sam twórca, pokrewne żarty i słownictwo"

postacie:
  - id: billy
    nazwa: "Billy"
    plec: m
    rejestr: "chłopak z prowincji, gwara, „panie Casino”, „panie Bum”; kałamarnica (czułki)"
    zrodlo: [tekst, fr]
  - id: rosa
    nazwa: "Pajęcza Rosa (Spider Rosa)"
    plec: k
    rejestr: "chłodna, wyniosła, bez gwary; „Matrona klanu”; inni mówią do niej „panno Roso”, McNeil „Robaczyco” (Bug Lady)"
    zrodlo: [tekst, it]
  - id: casino
    nazwa: "Casino (Doc Casino)"
    plec: m
    rejestr: "robot-hazardzista, gwara, „przyjacielu”, „kolego” (pard); odmiana: nieodmienne „Casino” (Doca Casino)"
    zrodlo: [fr, tekst]
  - id: kaboom
    nazwa: "Kaboom („pan Bum”, „Boom”)"
    plec: m
    rejestr: "gazowy górnik, gwara, przekleństwa"
    zrodlo: [tekst]
  - id: roswell
    nazwa: "Roswell („Roz”, „Ros”)"
    plec: m
    rejestr: "obcy pod kopułą, wyniosły, naukowy, bez gwary"
    zrodlo: [tekst]
  - id: spike
    nazwa: "Spike"
    plec: m
    rejestr: "cockney („stary” = mate), nałóg bimbru"
    zrodlo: [tekst]
  - id: fletch
    nazwa: "Fletch"
    plec: k
    rejestr: "łuczniczka podróżująca w czasie; „psze pani”/„panienko” w dialogach to zwykle ona"
    uwaga: "Dorosła wersja trzeciego bękarta (Młoda). Bastard1Recovered_2 po francusku „ange-gardienne”."
    zrodlo: [tekst, fr, it]
  - id: preach
    nazwa: "Kaznodzieja (Preach, Esther O'Neil)"
    plec: k
    rejestr: "kaznodziejka z gatlingiem, biblijne wtręty, gwara"
    odmiana: "„Kaznodzieja” jak rzeczownik męski na -a, ale z żeńską składnią („Kaznodzieja dała”)"
    zrodlo: [it, tekst]
  - id: judge
    nazwa: "Sędzia (The Judge)"
    plec: m
    rejestr: "robot-snajper, język prawniczy („Przychylam się”), gwara"
    zrodlo: [tekst, fr]
  - id: sarge
    nazwa: "Sierżant (Sarge)"
    plec: m
    rejestr: "stary koń bojowy (cyborg-koń), gwara wojskowa"
    zrodlo: [tekst, fr]
  - id: hopalong
    nazwa: "Hopalong („Hop”, Vansak Largo)"
    plec: m
    rejestr: "człowiek-wąż, farmer, gwara, kocha zwierzęta"
    zrodlo: [tekst, fr]
  - id: smoky
    nazwa: "Smoky („Kuchcik” u Spike'a)"
    plec: m
    rejestr: "robot-kucharz; zdenerwowany mówi WERSALIKAMI — zachowane"
    zrodlo: [tekst]
  - id: rawhide
    nazwa: "Rawhide"
    plec: m
    rejestr: "robot z rojem p-wiewiórek; mówi „my” i dziecinnie („Ten Billy potrzebuje wielu pomocy”); przedimki angielskie oddane jako „Ten/Ta”"
    zrodlo: [tekst, fr]
  - id: bekarty
    nazwa: "Mały Jeb (m), Jeb Junior (m), Młoda (k)"
    zrodlo: [tekst]
    uwaga: "„She got a fin on her” — trzeci bękart to dziewczynka."
  - id: ksiazeta
    nazwa: "McNeil (m), Francisco (k), Barrabas (m), Jebediah Chaste (m)"
    zrodlo: [tekst]
    uwaga: "Francisco jest kobietą („her younger brother”, „Chaste's daughter”)."
  - id: gracz
    nazwa: "banici ogólnie"
    plec: '?'
    uwaga: >
      Gra ma osobne wpisy „Fem” tam, gdzie forma zależy od płci banity (Ranny/Ranna).
      Gdzie takiego wariantu nie ma, a zdanie dotyczy dowolnego banity — formy bezrodzajowe
      (np. kwestie „…Pals”, „…JailPals” bez rodzaju ratującego).

