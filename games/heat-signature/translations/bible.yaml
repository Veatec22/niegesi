zrodla:
  - id: exe
    opis: Literały lokalnego Heat_Signature.exe (Steam build 6124596) z przypisaną funkcją GML, tools/extract_strings.py → work/strings.json.
  - id: dialog
    opis: Pliki Dialog/*.txt gry (13 plików); znaczniki [Blok], #odpowiedź, {Cel}, =ciąg dalszy, <Token>.
  - id: scenarios
    opis: Scenarios/*.dat — postacie wyzwań dziennych, nazwy przedmiotów, opisy misji.
  - id: log
    opis: notgeese/LogOutput.log z sesji użytkownika (0.1.2) — faktycznie rysowane napisy, work/run-0.1.2.log.
  - id: tvtropes
    opis: Wyszukiwarka streszcza TV Tropes (strona niedostępna, 403) — Breaker „he”, Geneva „she”, Mirfak „they”. Niepotwierdzone.
    url: https://tvtropes.org/pmwiki/pmwiki.php/Characters/HeatSignature
styl:
  ton: UI i instrukcje krótkie, bezpośrednie, w 2. osobie. Opisy przedmiotów rzeczowe, a dopiski-cytaty (reklamowe hasła frakcji) z suchym, czarnym humorem. Dialogi z suchym humorem, bez dopisywania memów.
  adaptacja: 'Zachować czynność i warunki instrukcji; nie dopisywać klawiszy obok ikon sterowania. Liczby z luk zostają cyframi; zdania z liczbą budujemy tak, by nie wymagały odmiany („Zabójstwa: 3”).'
  zrodlo: decyzja
  uwaga: Wygładzenie terminala jest osobnym ustaleniem użytkownika; nie obejmuje łagodzenia przekleństw w pozostałych dialogach.
  nazwy_przedmiotow: Gra składa nazwy z przymiotników i rzeczownika („Rechargeable High Capacity Swapper”). Po polsku rzeczownik pierwszy, przymiotniki za nim w odwróconej kolejności, zgodne w rodzaju, frazy „o dużej pojemności”/„dalekiego zasięgu” na końcu — przy ucinaniu „...” zostaje najważniejsze słowo. Wpisy item-* w translations/en-pl-review.json.
postacie:
  - id: gracz
    nazwa: losowa postać gracza
    plec: '?'
    mowi_do_gracza: '-'
    rejestr: Riposty w odpowiedziach dialogowych; bez form ujawniających płeć (czas teraźniejszy, bezosobowe).
    zrodlo: decyzja
    uwaga: 'Postacie są losowane (Female/Male w EXE). Wyjątek: w TutorialEnd graczem jest Fiasco.'
  - id: terminal
    nazwa: Terminal treningowy
    plec: n
    mowi_do_gracza: ty
    rejestr: Poprawna gramatyka, wersaliki i entuzjazm automatu.
    zrodlo: uzytkownik
    uwaga: Użytkownik wybrał „wygładź mimo wszystko”. Odrzucono celowe błędy „TRENING SIĘ ZACZĄĆ” i „ROBIĆ PRZEMOC”.
    przyklady:
      - en: PRACTICE IS START
        pl: TRENING ROZPOCZĘTY
        zrodlo: uzytkownik
      - en: EXCELLENT VIOLENCE!
        pl: ŚWIETNA WALKA!
        zrodlo: decyzja
  - id: fiasco
    nazwa: Sader Fiasco
    plec: k
    mowi_do_gracza: ty
    rejestr: Zmęczona zawodowczyni po czterdziestu latach szpiegostwa; krótkie, suche uwagi, dosadne słownictwo.
    zrodlo: [dialog]
    uwaga: 'Breaker o Fiasco: „she ain’t saying”, „she killed their commander”, „this white haired woman walks into my local” (BartenderDialogueFoundry.txt). Vertical 0.1.x błędnie przyjął formy męskie („wyobrażałem”, „Dostałem”) — poprawione w 0.2.0.'
    przyklady:
      - en: This is not how I pictured my retirement.
        pl: Nie tak wyobrażałam sobie emeryturę.
        zrodlo: dialog
  - id: breaker
    nazwa: Breaker Gemini
    plec: '?'
    mowi_do_gracza: ty
    rejestr: Swobodna, gadatliwa, ironiczna; była inżynier Foundry, barman.
    zrodlo: [dialog, tvtropes]
    uwaga: Płeć niepotwierdzona w plikach gry; kwestie bez form ujawniających płeć mówiącego. Imię nieodmienne („z Breaker”).
  - id: asli
    nazwa: Asli Sixty
    plec: k
    mowi_do_gracza: ty
    rejestr: Entuzjastyczna, dziecinnie radosna, makabryczne szczegóły podane z uśmiechem.
    zrodlo: [dialog]
    uwaga: 'O swojej pierwszej wersji: „She knew that when she pressed the button” (BartenderDialogueGlitchers.txt).'
  - id: geneva
    nazwa: Geneva Stonelock
    plec: '?'
    mowi_do_gracza: ty
    rejestr: Oschła szefowa ochrony z Offworld, lakoniczna, bezkompromisowa.
    zrodlo: [dialog, tvtropes]
    uwaga: Płeć niepotwierdzona w plikach; kwestie neutralne. Streszczenie TV Tropes wskazuje „she”.
  - id: mirfak
    nazwa: Mirfak Lagrange
    plec: '?'
    mowi_do_gracza: ty
    rejestr: Ciepły, gadatliwy, lubi teorie spiskowe; były kryptograf Sovereign.
    zrodlo: [dialog, tvtropes]
    uwaga: Płeć niepotwierdzona; kwestie neutralne (czas teraźniejszy zamiast „zostałem/zostałam”).
