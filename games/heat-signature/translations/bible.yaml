ustalenia_uzytkownika:
  - en: Yep. (odpowiedź gracza)
    pl: No tak.
    zrodlo: uzytkownik
    uwaga: Odrzucono „No.”, które łatwo wziąć za przeczenie.
  - en: Holy shit you're alive.
    pl: Jasna cholera, żyjesz.
    zrodlo: uzytkownik
    uwaga: Odrzucono „O kurwa, żyjesz.” jako mocniejsze niż oryginał.
  - en: PACIFIST / Liberator
    pl: PACYFIZM / Wyzwolenie
    zrodlo: uzytkownik
    uwaga: Odrzucono męskie „PACYFISTA”, „Wyzwoliciel” przy losowej płci postaci.
  - en: Shiplocked
    pl: pokładowy / Sprzęt pokładowy
    zrodlo: uzytkownik
    uwaga: Odrzucono „przypisany do statku” (dwuznaczne przed „dalekiego zasięgu”).
  - en: missions board / jobs board / Job Listings / Mission Listings
    pl: tablica zleceń / Oferty zleceń
    zrodlo: uzytkownik
    uwaga: Recenzent proponował „tablica misji”; użytkownik wybrał zlecenia.
