engine: GameMaker Studio 1.4 / YYC, x86
approach: Własny plugin D3D9 tłumaczy tekst przed łamaniem wierszy (wpisy dokładne, szablony zdań składanych przez grę, nazwy przedmiotów z polską odmianą) i podaje grze przetłumaczone kopie plików dialogów przy ich wczytaniu. Fonty sprite z otwartego Xolonium. Funkcje odkrywane po nazwach i instrukcjach, bez stałych adresów.
scope: Pełne — menu, ustawienia, samouczek, HUD, przedmioty, cechy, misje i klauzule, wyzwalanie, podpowiedzi, dziennik zdarzeń, rankingi i wszystkie 13 plików dialogów. Pominięto komunikaty diagnostyczne i tekst minigry naprawy (oProblem). 2536 wpisów plus 54 wiersze słownika nazw przedmiotów.
phase: full
test_notes: Fonty, odstępy i menu potwierdzone w grze na 0.1.2 (screen użytkownika 2026-09-25). Pełne tłumaczenie 0.2.0 po niezależnym przeglądzie językowym zainstalowane 2026-09-25; test w grze oczekuje. Sprawdzone bez gry — test silnika na napisach z logu gry, 661 z 662 linii dialogów tłumaczy się przy wczytaniu. EXE i oryginalne dialogi niezmienione.
