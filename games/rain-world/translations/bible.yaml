  - {en: slugcat, pl: ślimakot, formy: [ślimakot], zrodlo: [wiki-pl]}
  - {en: slugpup, pl: ślimakocię, formy: [ślimakoci], zrodlo: decyzja, uwaga: „pup” w Jolly Co-op to „maluch”}
  - en: Survivor
    pl: Ocalały
    formy: [ocalał]
    zrodlo: [wiki-pl, ru]
    uwaga: >-
      Wiki podaje raz „Przetrwaniec”, raz „Ocalały”; rosyjski „Выживший”. W wersji próbnej 0.1.0
      było „Przetrwaniec” — zmienione przy pełnym tłumaczeniu na naturalniejsze „Ocalały”.
  - {en: Monk, pl: Mnich, formy: [mnich], zrodlo: [wiki-pl]}
  - {en: Hunter, pl: Łowca, formy: [łowc], zrodlo: [wiki-pl]}
  - {en: Gourmand, pl: Smakosz, formy: [smakosz], zrodlo: decyzja, uwaga: „indulger of the simpler pleasures”}
  - en: Artificer
    pl: Pirotechnik
    formy: [pirotechni]
    zrodlo: decyzja
    uwaga: >-
      „master of pyrotechnics and explosives”; wiki ma „Artyficer”, rosyjski „Техник” (rzeczownik męski
      jako imię). W komentarzu Andrew mówi o niej „she” i „jej dzieci”; imię zostaje, a zaimki w tych
      liniach idą przez „ta postać”/„jej”. „Pirotechniczka” odrzucona — użytkownik zaakceptował
      „Pirotechnik” 2026-09-24 (zrodlo: uzytkownik).
