# Rain World — biblia tłumaczenia. Format: .claude/skills/localization/BIBLE.md

zrodla:
  - id: wiki-pl
    opis: Polska wersja oficjalnej wiki (Miraheze), tłumaczona przez społeczność; niepełna i niespójna (Survivor raz „Przetrwaniec”, raz „Ocalały”).
    url: https://rainworld.miraheze.org/wiki/Creatures/pl
  - id: wiki-pl-obrzeza
    opis: Strona regionu Outskirts na polskiej wiki — Obrzeża, Mnich, Włócznik.
    url: https://rainworld.miraheze.org/wiki/Outskirts/pl
  - id: kod
    opis: Kontekst z work/en.json — klasy gry, w których tekst stoi w kodzie (tools/StrMap.cs).
  - id: ru
    opis: Rosyjska tabela gry (work/ref-rus.json) — płeć w czasie przeszłym, tłumaczenie imion i skrótów.
  - id: mechanika
    opis: Ustalenia z kodu gry, opisane w docs/technical.md.

postacie:
  - id: gracz
    nazwa: ślimakot gracza
    plec: m
    mowi_do_gracza: ty
    rejestr: podpowiedzi i opisy zwracają się do gracza w 2. osobie, krótko
    zrodlo: [kod, decyzja]
    uwaga: >-
      Angielski nie określa płci ślimakotów; „ślimakot” jest rodzaju męskiego, więc formy
      o graczu („jesteś głodny”, „wróciłeś”) idą za rzeczownikiem. Iteratory mówią o nim „it” —
      tam, gdzie to „stworzenie”, forma nijaka („jest zbyt głupie”).
  - id: ksiezyc
    nazwa: Patrząca na Księżyc (przezwisko Luna)
    plec: k
    klucz: 'SLOracleBehavior|MoonConversation'
    mowi_do_gracza: ty; do gracza „mały stworku”, „przyjacielu”, „mały archeologu”
    rejestr: ciepła, zmęczona, uprzejma; po uszkodzeniu urywane zdania
    zrodlo: [ru]
    uwaga: rosyjski „Смотрящая-на-Луну”, „я устала”, „я говорила”
  - id: kamyki
    nazwa: Pięć Kamyków (przezwisko Kamyk)
    plec: m
    klucz: 'SSOracleBehavior|PebblesConversation|CLOracleBehavior|SSOracleRotBehavior'
    mowi_do_gracza: ty; „mały stworku”
    rejestr: chłodny, wyniosły, sarkastyczny; w kampanii Świętego zgaszony
    zrodlo: [ru]
    uwaga: >-
      W Downpour ta sama klasa (SSOracleBehavior, SSSleepoverBehavior) mówi też za Księżyc
      sprzed upadku w kampanii Włócznika — płeć ustalana linia po linii z rosyjskiego
      („я думала”, „я рада” = Księżyc; „я занят”, „побыть один” = Kamyki).
  - id: bak
    nazwa: Bąk (Spinning Top)
    plec: m
    mowi_do_gracza: ty; o graczu w 3. os. nijakiej („jest zbyt głupie”)
    rejestr: kpiący, dziecinny, wykrzyknienia „OA!”
    zrodlo: [ru]
    uwaga: >-
      Rosyjski w wielu miejscach unika form rodzajowych („мне хотелось”), ale w dialogu 209
      ma „Я провёл” — rodzaj męski; zgodne też z rzeczownikiem „bąk”.
  - id: ksiaze
    nazwa: Książę (Prince, Watcher)
    plec: m
    rejestr: egzaltowany, dworski („Albowiem zostaniesz wywyższony”)
    zrodlo: [decyzja]
  - id: iteratory-czatlogi
    nazwa: iteratory o nieustalonej płci (GW, HR, UU, WO, EOC, PG, SI, PI, Niezrównana Niewinność)
    plec: '?'
    rejestr: plotkarski czat grup iteratorów
    zrodlo: [ru]
    uwaga: >-
      Rosyjski konsekwentnie unika rodzaju w ich liniach; robimy tak samo („doszły mnie”, „nie wypada mi”).
      Męscy według rosyjskiego: SCS, BZN, NGI; żeńskie: SSL, Luna, Drzazga Słomy.
  - id: starozytni-dokumenty
    nazwa: listy i zwoje starożytnych (perły 42, 237, 238)
    plec: '?'
    zrodlo: [decyzja]
    uwaga: >-
      Bez rodzaju, chyba że tekst go podaje: w 238 autor pisze o sobie „Nine-Leaf, when he comes”
      (parodia skargi na Ea-nasira), więc tam formy męskie.
  - id: tworcy
    nazwa: twórcy More Slugcats w komentarzu (Andrew, Will, Dakras, Norgad, Screams, Cappin, Slugitar i in.)
    plec: '?'
    mowi_do_gracza: ty / wy
    rejestr: luźny, entuzjastyczny, żarty z procesu tworzenia
    zrodlo: decyzja
    uwaga: >-
      Prawdziwe osoby; płci nie wnioskujemy z imion ani pseudonimów. Pierwsza osoba bez form
      rodzajowych („udało mi się”, „moim zamiarem było”, strona bierna). O innych twórcach
      w 3. osobie tylko tak, jak mówi oryginał („he” Cappin, „they” Minkimaro/Ender → bez rodzaju).
      Postacie gry nazywamy rzeczownikami rodzaju męskiego (Pirotechnik, Strumyk) i uzgadniamy
      z nimi formy, chyba że twórca podkreśla płeć — wtedy „ta postać”, „ona” (Pirotechnik:
      Andrew mówi „she”, „her children”).

terminy:
