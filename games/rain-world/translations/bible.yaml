ustawienia:
  dialog_klucz: '^dlg:'

ignoruj:
  - sprawdzenie: terminy
    klucz: '^dlg:lm_tower09-white\.txt#'
    powod: Andrew rozwija angielskie skróty regionów; nazwy zostają po angielsku, bo tłumaczą skróty
  - sprawdzenie: terminy
    klucz: '^(str:The passage of time|dlg:126\.txt#9|dlg:sh_e04riv-white\.txt#5)'
    powod: „passage of time” to upływ czasu, nie przeprawa
  - sprawdzenie: typografia
    klucz: '^dlg:(138|139)\.txt#'
    powod: 'dopisek „ : -30” to instrukcja gry, dzięki której linia nie jest wyświetlana (jak w EN)'
  - sprawdzenie: terminy
    klucz: '^str:(watcher-name|watcher-description)$'
    powod: nazwa dodatku The Watcher zostaje po angielsku
