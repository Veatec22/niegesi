zrodla:
  - id: klucze
    opis: Klucz dialogu kończy się mówiącym i numerem, np. D_0_Walkie_1_PUPPY_1.
  - id: ru
    opis: Rosyjski arkusz gry (RU_DIALOGUES) — płeć w czasie przeszłym, forma nazw miejsc.
  - id: es
    opis: Hiszpański arkusz gry — rodzaj w tytułach postaci (LA ANCIANA).
  - id: en
    opis: Angielski tekst gry (zaimki, relacje rodzinne).

postacie:
  - id: laika
    nazwa: Laika
    plec: k
    klucz: '_LAIKA_\d+$'
    mowi_do_gracza: '-'
    rejestr: szorstka, ironiczna, przeklina; do matki „matko”, do córki „kochanie”
    odmiana: 'Laika, Laiki, Laice; w zwrocie bezpośrednim mianownik „Laika”; Laika też zwraca się do innych w mianowniku („Hilda”, „Jakob”). Wyjątki świadome — wołacz u innych postaci: Hilda „słodka Laiko”, Maya „Avo”, „Mayo” (górniczka), rytualne „bracie Jakobie”'
    zrodlo: [klucze, ru, en]
  - id: puppy
    nazwa: Puppy
    plec: k
    klucz: '_PUPPY_\d+$'
    rejestr: małe dziecko, „mamusiu”
    odmiana: nieodmienne (Puppy, do Puppy)
    zrodlo: [klucze, en]
    uwaga: córka Laiki; imię zostaje, jak w ES i RU
  - id: maya
    nazwa: Maya
    plec: k
    klucz: '_MAYA_\d+$'
    rejestr: twarda, wojenna przeszłość
    odmiana: Maya, Mai, Mayę
    zrodlo: [klucze, en]
    uwaga: matka Laiki, babcia Puppy
  - id: jakob
    nazwa: Jakob
    plec: m
    klucz: '_JAKOB_\d+$'
    odmiana: Jakob, Jakoba; zwrot „Jakob”, rytualnie „bracie Jakobie”
    zrodlo: [klucze, en]
    uwaga: jak brat dla Laiki, dla Puppy „wujek”; ojciec Poochiego
  - id: chief
    nazwa: Starsza
    plec: k
    klucz: '_CHIEF_\d+$'
    rejestr: podniosły, przywódczyni wioski
    zrodlo: [ru, es, en]
    uwaga: 'EN „THE ELDER” i zaimki niebinarne „ey/em/eir” (D_B_Carey_AfterMissions3, Q_D_1_Mines_BackHome); RU „я слышала”, ES „LA ANCIANA” — kobieta. Decyzja — forma żeńska jak RU/ES, bo polski nie ma utartej formy niebinarnej w grach'
  - id: poochie
    nazwa: Poochie
    plec: m
    odmiana: Poochie, Poochiego, Poochiemu
    zrodlo: [en]

  - {id: shaza, nazwa: Shaza, plec: k, klucz: '_SHAZA_\d+$', rejestr: 'ciepła, techniczka; do Laiki „kochana” (EN „hon”)', zrodlo: [klucze, ru]}
  - {id: roy, nazwa: Roy, plec: m, klucz: '_CAPTAIN_\d+$', rejestr: 'przezywa Laikę „radiowcu”, ale mówi do niej w rodzaju żeńskim', zrodlo: [ru]}
  - {id: orella, nazwa: Orella, plec: k, klucz: '_ORELLA_\d+$', zrodlo: [ru, en]}
  - {id: primo, nazwa: Primo, plec: m, klucz: '_PRIMO_\d+$', rejestr: 'odgrywa obie strony rozmowy: „pytasz mnie”, „mówię”', zrodlo: [en]}
  - {id: pluck, nazwa: Pluck, plec: m, klucz: '_INSIDER_\d+$', rejestr: 'Ptak Renegat, dzieciak; „Tss”', zrodlo: [ru]}
  - {id: hektystka, nazwa: Hektystka, plec: k, klucz: '_ANARCHIST_\d+$', rejestr: 'anarchistka Chaosu; Laikę nazywa „zakutym łbem” (EN bonehead)', zrodlo: [en]}
  - {id: unae, nazwa: Unae, plec: m, klucz: '_UNDERTAKER_\d+$', zrodlo: [en, es], uwaga: 'grabarz; EN „he” (Molly), ES „el enterrador”; RU ma kobietę — przyjęto EN'}
  - {id: kris, nazwa: Kris, plec: k, klucz: '_COOK_\d+$', rejestr: '„Rzecz w tym”', zrodlo: [ru]}
  - {id: carey, nazwa: Carey, plec: k, klucz: '_CAREY_\d+$', rejestr: '„cholernie pewna”; przedrzeźnia Laikę, zamieniając samogłoski na „i”', zrodlo: [en]}
  - {id: zooey, nazwa: Zooey, plec: k, klucz: '_BLACKSMITH_\d+$', rejestr: '„Miażdżąco!”, do Laiki „żołnierzu”', zrodlo: [en]}
  - {id: maniu, nazwa: Maniu, plec: k, klucz: '_SHOPKEEPER_\d+$', rejestr: '„Moja najdroższa przyjaciółko”', zrodlo: [en]}
  - {id: kidgutter, nazwa: Kidgutter, plec: m, klucz: '_KIDGUTTER_\d+$', uwaga: 'ptasi kapitan-dziecko (ES „Soy un niño”)', zrodlo: [es]}
  - {id: boo, nazwa: Boo, plec: m, zrodlo: [ru]}
  - {id: kai, nazwa: Kai, plec: m, klucz: '_GUITAR_\d+$', zrodlo: [ru]}
  - {id: kobiety_poboczne, nazwa: 'Fogg, Gusto, Rollo, Fernidu, Beícoli, Camilla, Dalia, Mina, Gunda, Hilda, Molly, Lewis, Tressie, Pebble, górniczka', plec: k, zrodlo: [en, ru]}
  - {id: mezczyzni_poboczni, nazwa: 'Jakob, Han, Qwota, Borden, Petey, Alfredo, Herman, Inok, Walterio, Trook, Lee', plec: m, zrodlo: [en, ru]}

