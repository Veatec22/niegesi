ignoruj:
  - sprawdzenie: angielski
    klucz: '^(Item/deck-|Item/sticker-|Item/truck-|Achievement/ach-(05|06|10)|Levels/|Speaker/|chapters/|quests/)'
    powod: nazwy własne, gry partnerskie na blatach i naklejkach, marki
  - sprawdzenie: wielkie_litery
    klucz: '.'
    powod: >
      oryginał pisze wielką literą byty świata gry (the Moon, the Skater, the Devil's Laundry);
      tłumaczenie trzyma ten styl konsekwentnie
  - sprawdzenie: spojnosc
    klucz: '^UI/'
    powod: „OTWARTY” na łuku vs „Otwórz” w podpowiedzi, „dalej” vs „Kontynuuj” — różne miejsca
  - sprawdzenie: typografia
    klucz: '(seizure-warning|5kickflip-1-seq-05)'
    powod: ostrzeżenie zdrowotne to istniejący tekst twórców; spacja na początku to literówka oryginału
