# Biblia tłumaczenia Skate Story — fakty ze źródłami. Format: .claude/skills/localization/BIBLE.md
# Przegląd wstecz (2026-09-22): tłumaczenie powstało przed skillem, biblia spisuje to, co już przyjęto.

zrodla:
  - id: type
    opis: Kolumna TYPE tabeli I2 — mówiący w dialogach („Dialogue — Rabbie”). Zrzut work/ref-extract.py → work/ref-all.json (poza gitem).
  - id: notes
    opis: Kolumna NOTES tabeli I2 — notatki twórców (133 wpisy), w review jako `context`.
  - id: ru
    opis: Rosyjska kolumna tej samej tabeli — płeć w czasie przeszłym. Porównanie z PL skryptem work/gender-ru.py.
  - id: fr
    opis: Francuska kolumna — rozstrzyga, gdy RU jest wątpliwe („Il m'a vu”).

postacie:
  - id: skejter
    nazwa: Skejter (Szklany Skejter, demon)
    plec: m
    mowi_do_gracza: '-'
    rejestr: narracja w 3. osobie czasu przeszłego; do Skejtera wszyscy na „ty”, Licha z Departamentu per „pan”
    zrodlo: [ru]
    uwaga: w oryginale bez płci („the Skater”, „it”); polski rodzaj męski za rzeczownikami „skejter” i „demon”.
  - id: krolik
    nazwa: Królik / Rabbie → Gwiezdnooki Szczur
    plec: m
    rejestr: kumpelski, zmęczony, ucieka przed kłopotami („Wybacz”)
    zrodlo: [ru, type]
  - id: filozof
    nazwa: Filozof
    plec: m
    rejestr: pompatyczny, „w istocie”, „rozważmy”, neologizmy („zadumiewające”)
    zrodlo: [ru, type]
  - id: philoso
    nazwa: Philoso
    plec: m
    rejestr: mówi rymowanymi czterowierszami; rym ważniejszy niż dosłowność
    zrodlo: [type]
  - id: beea
    nazwa: Beea (kwiaciarka)
    plec: k
    rejestr: ciepła, „kochanie”, „skarbie”
    zrodlo: [ru]
    uwaga: RU „я обменяла”; Oscar mówi o niej „ta ślicznotka z kwiaciarni”.
  - id: coney
    nazwa: Coney
    plec: m
    rejestr: nadgorliwy funkcjonariusz Zgiełku, „kolego”, wersaliki przy przepisach
    zrodlo: [ru]
  - id: frotue
    nazwa: Frotue (Żaba)
    plec: m
    rejestr: uprzejmy sprzedawca
    zrodlo: decyzja
    uwaga: >
      o sobie w rodzaju męskim („Wcale tam nie spałem”), ale narracja nazywa go „Żaba”, więc
      „spytała Żaba”, „Żaba płakała” — zgoda z rzeczownikiem, jak „Pizza Świnia” w Anger Foot.
  - id: licha
    nazwa: Licha (telefon z Departamentu Śmierci)
    plec: k
    mowi_do_gracza: pan
    zrodlo: decyzja
    uwaga: RU nie rozstrzyga; urzędniczka w słuchawce, forma „pańskiej umowy”.
  - id: szkielety
    nazwa: Szkielety (NPC)
    plec: m
    zrodlo: [ru, fr]
    uwaga: każdy szkielet to inna dusza; na Placu Żalu RU „я понадеялся” i FR „il m'a vu” → „Myślałem”.
  - id: kamien-mlynski
    nazwa: ??? (kamień młyński, ch9)
    plec: m
    zrodlo: decyzja
    uwaga: RU żeński, ES („enterrado”) i FR („enterré”) męskie; po polsku „kamień młyński” jest męski.
  - id: szata-diabla
    nazwa: Szata Diabła
    plec: k
    zrodlo: [ru]
  - id: pingwin
    nazwa: Penin (Pingwin)
    plec: m
    rejestr: snobistyczny jubiler, „skarbie”, „mój drogi gryzoniu”
    zrodlo: [ru]
  - id: falszywe-slonce
    nazwa: Fałszywe Słońce
    plec: n
    zrodlo: decyzja
    uwaga: w dialogach mówi o sobie „Księżyc”; czasowniki w rodzaju nijakim za „Słońce” („zaśmiało się”).

