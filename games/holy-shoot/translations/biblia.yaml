# Biblia tłumaczenia Holy Shoot — fakty ze źródłami. Format: .claude/skills/lokalizacja/BIBLIA.md
# Stan: pełne tłumaczenie 0.2.0 (1286/1286).

zrodla:
  - id: locres
    opis: "PVD/Content/Localization/Game/en/Game.locres, Steam build 24334618 (jedyny język gry; innych tabel brak)."
  - id: tekst
    opis: "Oryginalny tekst: opisy postaci (he/she), imiona, kontekst kwestii."

postacie:
  - id: samuel
    nazwa: "Naddźwiękowy Samuel (Supersonic Samuel)"
    plec: m
    klucz: 'SupersonicSamuel_'
    rejestr: "były sprinter, zadziorny, przechwałki o szybkości"
    zrodlo: [tekst]
    uwaga: "„made him a hero”, „his athletic career”."
  - id: toshiko
    nazwa: "Toshiko Techno"
    plec: k
    klucz: 'ToshikoTechno_'
    rejestr: "wynalazczyni, żargon informatyczny (debug, patch, restart, 404)"
    zrodlo: [tekst]
    uwaga: "„she fused tech with combat”. DashDesc_Toshiko w oryginale ma błędne „his path” — po polsku „swojej drodze”."
  - id: gracz
    nazwa: "gracz (Samuel albo Toshiko)"
    plec: '?'
    uwaga: "Wszystko, co mówi się do gracza (NPC, bossowie, wróżka, opisy), jest bezrodzajowe."
  - id: wrozka
    nazwa: "Wróżka, towarzyszka (Fairy Companion)"
    plec: k
    klucz: 'Fairy_'
    rejestr: "pyskata, złośliwa"
    zrodlo: decyzja
    uwaga: "W oryginale „it”; po polsku „wróżka”, więc forma żeńska („Przybyła twoja bohaterka”)."
  - id: baron
    nazwa: "Baron Przypalacz (Baron Burnsalot) – Szatan"
    plec: m
    klucz: 'BaronBurnsalot_'
    rejestr: "rozwydrzony bobas: mamusia, smoczek, mleczak"
    zrodlo: [tekst]
  - id: lady
    nazwa: "Lady Miłogeddon (Lady Lovemageddon) – Asmodeusz"
    plec: k
    klucz: 'LadyLovemageddon_'
    rejestr: "uwodzicielska, „kochanie”"
    zrodlo: [tekst]
  - id: mammon
    nazwa: "Komornik (The Debtkeeper) – Mamona"
    plec: m
    klucz: 'Mammon_'
    rejestr: "korporacyjno-finansowy żargon"
    zrodlo: [tekst]
  - id: druidka
    nazwa: "Milka Krasula, Królowa Druidów (Milcah Kow)"
    plec: k
    zrodlo: [tekst]
    uwaga: "Gra słów „milk a cow” → krowa Milka + Krasula."
  - id: maja
    nazwa: "Kupulkan, majański duch (Needapu)"
    plec: m
    zrodlo: decyzja
    uwaga: "„Need a poo” → Kukulkan + kupa; kwestia o żartach z imienia działa dalej."
  - id: spearatrix
    nazwa: "Spearatrix, spartańska wojowniczka"
    plec: k
    zrodlo: decyzja
    uwaga: "Końcówka -trix; kwestia „byłam numerem 301”."

