zrodla:
  - id: strg
    opis: Napisy z chunku STRG w data.win (work/candidates.json, numer = kolejność kandydata).
  - id: fp
    opis: dia_fp.json — misje, wiersze i rozmowy płomieni; ścieżka węzła w kluczu.
  - id: dia
    opis: Pozostałe dia_*.json — sejfy, notatki, rozmowa w finale.
  - id: kierunek
    opis: docs/translation-decisions.md — próbka przed verticalem, cztery tematy rozstrzygnięte przez użytkownika 2026-09-25.

styl:
  ton: >-
    Mroczny noir z nieumarłymi. Suchy, rzeczowy głos żniwiarza w opisach misji,
    wyrocznia w wierszach, gangsterskie docinki wrogów, rwane narkotyczne monologi z kaset.
    Bez dopisywania humoru; żarty twórców zostają nietknięte.
  adaptacja: >-
    Tytuły misji i osiągnięć z grą słów adaptujemy; łacina i obce cytaty zostają.
    Nie wyrównujemy niekonsekwencji oryginału (1./2. osoba narracji).
  zrodlo: uzytkownik
  uwaga: >-
    Użytkownik 2026-09-25 przyjął kierunek próbki: wiersze rymowane ze stałym refrenem,
    „żniwiarz”, gangi po angielsku. Przekleństwa w kasetach mocniejsze niż proponowałem:
    „jebany” za „fucking” (odrzucony „pieprzony”). Stopnia wulgarności nie podnosimy
    tam, gdzie EN go nie ma.

postacie:
  - id: zniwiarz
    nazwa: żniwiarz
    plec: m
    rejestr: >-
      Rzeczowy, zimny, krótkie zdania w 1. osobie („Znajdę, co ukrywają.”).
      O zleceniodawcy mówi „mój pracodawca”.
    odmiana: żniwiarza, żniwiarzu (wołacz), żniwiarzem
    zrodlo: [fp, strg, kierunek]
    uwaga: >-
      Rodzaj męski: kominek „A man of light… his time” (fp map_mission7/map_lamp),
      wrogowie „He's... coming...” (strg 446). „reaper” małą literą jak w EN;
      „grim reaper” = „ponury żniwiarz”. Odrzucone: „kosiarz” (żartobliwy), „Kostucha” (rodzaj żeński).
    przyklady:
      - klucz: strg 73
        en: Not bad, reaper.
        pl: Nieźle, żniwiarzu.
        zrodlo: uzytkownik
  - id: plomienie
    nazwa: płomienie / kominek
    plec: m   # o sobie: „Pomyślałem”, „Nie spodziewałem się gości”; kasety mówią o nim „he”; „płomienie” jako rzeczownik — lm
    mowi_do_gracza: ty („przyjacielu”)
    rejestr: >-
      Wyrocznia: tylko wierszem. Rym i rytm ważniejsze od dosłowności (użytkownik
      2026-09-25, po przeglądzie): obraz można przesunąć, sens misji, wyróżnienia
      &y&/&b& i refren zostają;
      poza cytatem („spoke the fireplace”) krótkie, ciepłe, uroczyste zdania.
    zrodlo: [fp, kierunek]
    uwaga: >-
      Refren zawsze „…nie może przy mnie żyć” / „…nie mogą przy mnie żyć”
      (EN „cannot live with me”, 8 wystąpień). W zwrotce, gdzie wiersz mówi o pukaniu,
      zostaje „zapukaj” — to mechanika gry. Odrzucony wiersz wolny.
    przyklady:
      - klucz: fp map_mission4/Description
        en: '"No moment to flee -# he should not be here.#&y&A man with a heart&!&,#cannot live with me."'
        pl: '„Nie ma dokąd zbiec -# on nie powinien tu być.#&y&Człowiek, co ma serce&!&,#nie może przy mnie żyć.”'
        zrodlo: uzytkownik
      - klucz: fp map_mission1/Description
        en: '"My Candles tell me tales,#&y&Undead&!& form and blossom#Find their abode and knock,#And free them from their jails." ##The flames never spoke in prose.'
        pl: '„Świece szepczą mi wieści:#&y&Nieumarli&!& wciąż się mnożą.#Znajdź ich dom i zapukaj,#niech ich cele się otworzą.” ##Płomienie nigdy nie mówiły prozą.'
        zrodlo: uzytkownik
  - id: kasety
    nazwa: narratorzy kaset
    plec: '?'
    rejestr: rwane, krótkie zdania; przekleństwa rzadkie, w chwilach załamania
    zrodlo: [strg, kierunek]
    uwaga: >-
      Każda kaseta to inny narrator (zombie, wampirzyca, szkielet…); płeć ustalać z treści
      kasety („My husband agrees” = kobieta). „fucking” → „jebany” (decyzja użytkownika).
    przyklady:
      - klucz: strg 165
        en: My heart drops through the fucking floor and I lose it, forever.
        pl: Serce spada mi przez jebaną podłogę i puszczają mi nerwy. Na dobre.
        zrodlo: uzytkownik

