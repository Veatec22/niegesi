technika: >-
  Fonty gry nie mają „ ” ani półpauzy: cudzysłowy " lub ', myślnik -.
  Doklejane imiona i liczby: forma z dwukropkiem („Zabij: Puff”, „Liczba zgonów: 5.”).
  Podpowiedzi klawiszy wersalikami w trybie rozkazującym, apostrofy i znaczniki &y& &!& # bez zmian.

ustawienia:
  max_wiersz: 0   # nieustalone; fontTiny jest bardzo mały, sprawdzić w verticalu

ignoruj:
  - sprawdzenie: typografia
    klucz: '.*'
    powod: fonty gry nie mają „ ” ani półpauzy — proste cudzysłowy i dywiz to decyzja (technika)
  - sprawdzenie: brak
    klucz: '^s1724$'
    powod: "' Souls' po liczbie celowo puste — jednostka w nagłówku 'NAGRODA W DUSZACH: '"
  - sprawdzenie: angielski
    klucz: 'map_portal/Name$'
    powod: „portal” to także polskie słowo
  - sprawdzenie: terminy
    klucz: 'map_mission5/Description$'
    powod: wiersz płomieni — „piekielne psy” jako wariant poetycki terminu
  - sprawdzenie: terminy
    klucz: 'map_mission22/Description$'
    powod: wiersz płomieni — „zapomnianych trupów rój” dla rymu z „twój”
