# Imiona, kody, slang, stylizowane okrzyki i nazwy klawiszy sprawdzone w pełnym review.
bez_tlumaczenia:
  [Pedro, Mitch, ISP, LOL, GG, GLHF, Tab, Home, My Friend Pedro,
   Bob, John, Dave, Rutger, Ayoze, Hunter, Denny, 1337dealWithIT,
   ISP-23698, ISP-23701, ISP-88172, Mech, Shamona, 'Hahahahaha!', ZOMG,
   'Lag!', OMFG, 'Aggro!', 'Zerg!', MOB, Caps Lock, Menu, Backspace,
   Insert, Page Up, Page Down, End, Delete, Scroll Lock, HUD]

ustawienia:
  dialog_klucz: '^w\d'

ignoruj:
  - sprawdzenie: tokeny
    klucz: '^inNoMap$'
    powod: '[Not mapped] jest tekstem etykiety, nie komendą; potwierdza walidator build.py.'
  - sprawdzenie: spojnosc
    klucz: '^(pep8|pep20|hChW|mChgWep|mKick|bul28)$'
    powod: Pełny review potwierdza odmienne funkcje poleceń, nazw czynności i komunikatów punktowych oraz dopuszczalne warianty pochwał.
  - sprawdzenie: wielkie_litery
    klucz: '^in23$'
    powod: Dwa równorzędne polecenia „Skocz / Puść”, nie Title Case przeniesiony z EN.
