ignoruj:
  - sprawdzenie: angielski
    klucz: '^(1002|1010|1012|1032|1050|1054|1056|1072|1082|1084|1090|1096|1100|1140|1144|1150|1154|1186|30\d\d|70\d\d|110(1\d|2\d)|504|506|9331|10524|10531|10532|11010|2048|2097|2116|3505|3551|3558|4045|6012|8000|8012|9538)$'
    powod: nazwy własne broni, atutów, figurek i bossów, onomatopeje
  - sprawdzenie: typografia
    klucz: '^5[0-7]$'
    powod: złożenia „Naciśnij [klawisz], aby…” — przecinek zamiast spacji jest celowy
  - sprawdzenie: wielkie_litery
    klucz: '.'
    powod: nazwy własne świata (Zagubiona Komnata, Kościół Stali, Różana Sala, Ukryta Warstwa)
