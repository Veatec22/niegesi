# Biblia tłumaczenia Anger Foot — fakty ze źródłami. Format: .claude/skills/lokalizacja/BIBLIA.md
# Przegląd wstecz (2026-09-22): tłumaczenie powstało przed skillem, biblia spisuje to, co już przyjęto.

zrodla:
  - id: tabela
    opis: >
      Pola Speaker i To w każdym LocalizedString (np. „NPC (Female)” > „Player”).
      Gra sama podaje płeć mówiącego i adresata. W review są w kluczu: `<ścieżka> [mówiący > adresat]`.
      Zrzut: work/ref-extract.py → work/ref-all.json (poza gitem).
  - id: kontekst
    opis: Pole Description (notatki twórców dla tłumaczy), w review jako `context`.
  - id: ru
    opis: Rosyjska tabela gry — do gracza konsekwentnie w rodzaju męskim („ты опоздал”, „ты пришёл”).

postacie:
  - id: gracz
    nazwa: Anger Foot
    plec: m
    mowi_do_gracza: '-'
    rejestr: nie mówi; inni zwracają się do niego na „ty”
    odmiana: w wołaczu bez zmian („Mam cię dość, Anger Foot!”), w dopełniaczu „Anger Foota” („Buty Anger Foota”)
    zrodlo: [ru, tabela]
  - id: npc-k
    nazwa: postacie żeńskie (NPC, Anger Girl, Prezeska)
    plec: k
    klucz: '\[[^\]>]*\(Female\) >'
    mowi_do_gracza: ty
    zrodlo: [tabela]
  - id: npc-m
    nazwa: postacie męskie (NPC, Minister Zbrodni, Glut Glina, Pizza Świnia, dostawca)
    plec: m
    klucz: '\[[^\]>]*\(Male\) >'
    mowi_do_gracza: ty
    zrodlo: [tabela]
  - id: anger-girl
    nazwa: Anger Girl
    plec: k
    rejestr: dziewczyna bohatera, energiczna, potoczna („Ekstra!”, „Ruszamy!”); w polskim tekście nie pada jej imię
    zrodlo: [tabela, kontekst]
  - id: minister
    nazwa: Minister Zbrodni
    plec: m
    rejestr: polityk, patetyczny monolog złoczyńcy; zwroty do gracza „Anger Foot”
    zrodlo: [tabela, kontekst]
  - id: prezeska
    nazwa: Prezeska
    plec: k
    rejestr: szefowa Gangu Biznesu (Office Boss (Female)); „The CEO” jako tytuł, stąd wielka litera
    zrodlo: [tabela]
  - id: pizza-swinia
    nazwa: Pizza Świnia
    plec: m
    odmiana: >
      „Świnia” odmienia się jak rzeczownik żeński (Pizza Świni, Pizza Świnio), ale czasowniki
      i zaimki są męskie, bo to on („Pizza Świnia próbował nas zabić”, „jego dodatki”).
    zrodlo: [tabela]
  - id: glut-glina
    nazwa: Glut Glina
    plec: m
    odmiana: obie części („Glutem Gliną”, „Gluta Gliny”); partner Worek Glina tak samo („Worku Glino!”)
    zrodlo: [tabela, kontekst]
  - id: smieciowy-boss
    nazwa: Baron Mazi / Umysł Brudu
    plec: m
    rejestr: w tabeli „Neutral”; po polsku rodzaj męski za nazwą (Baron, Umysł)
    zrodlo: decyzja
    uwaga: nazwy są rodzaju męskiego, więc formy męskie brzmią naturalnie („jestem taki zapominalski”).

