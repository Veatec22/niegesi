ustawienia:
  dialog_klucz: '^Dialogue/'
  max_wiersz: 60   # dymki nad postaciami, gra sama zawija; brak twardego limitu

ignoruj:
  - sprawdzenie: liczebniki
    klucz: '^UI/Star Goals/'
    powod: >
      „zbirów”, „wrogów”, „lewitujących” (męskoosobowe) są poprawne dla każdej liczby od 2; cele z 1 nie
      występują. Nieosobowe przebudowane na „karaluchy: {0}”, „węże: {0}”.
  - sprawdzenie: liczebniki
    klucz: '^UI/(Challenge Levels|HUD)/'
    powod: >
      przebudowane („w czasie poniżej {0} s”, „kopiąc mniej niż {0} razy”, „strzały w głowę: {0}”);
      „Kopnąłeś {0} razy.” opisane w decyzjach
  - sprawdzenie: angielski
    klucz: 'Urinal Puker|Child 2|Oinker 4|Mathematician 4|Tester 3|Fine Art Thinker|Water Cooler 3|Antialiasing|Display/Gamma|Ambient Occlusion|Enable Bloom|Challenge Bonus|Save Slot|Main Menu/Start|Tutorials/(Drifting|Gamepad Driving)|Credits/(DAQA|LQA)|Vape Collectible Type'
    powod: onomatopeje, wtrącenia, skróty techniczne i słowa przyjęte w polszczyźnie (Amen, Wow, Bloom, Vape, Slot, Start, Bonus)
  - sprawdzenie: spojnosc
    klucz: '(Default|Continue)'
    powod: celowo — „Domyślny” tryb licznika vs przycisk „Domyślne”; „Dalej” po poziomie vs „Wróć do gry” w pauzie
  - sprawdzenie: typografia
    klucz: '(Window Lady 2|Energy Drinker 3|Organic Trash Man 1|Default Button)'
    powod: spacja na końcu w oryginale to literówka twórców, nic nie jest doklejane
